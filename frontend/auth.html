<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Management System - Login/Register</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .auth-card {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-header h1 {
      font-size: 28px;
      color: #333;
      margin: 0;
    }

    .auth-header p {
      color: #666;
      margin: 5px 0 0 0;
      font-size: 14px;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
      font-size: 18px;
    }

    .form-group input[type="password"] + .password-toggle {
      margin-top: 12px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .auth-toggle {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .auth-toggle p {
      color: #666;
      margin: 0;
      font-size: 14px;
    }

    .auth-toggle button {
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
      margin-left: 5px;
      font-size: 14px;
    }

    .auth-toggle button:hover {
      color: #764ba2;
    }

    .error-message {
      background-color: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 15px;
      display: none;
      border-left: 4px solid #c33;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background-color: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 15px;
      display: none;
      border-left: 4px solid #3c3;
      font-size: 14px;
    }

    .success-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      margin: 15px 0;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .form-link {
      text-align: center;
      margin-top: 15px;
    }

    .form-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .form-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 30px 20px;
      }

      .auth-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>🏨 Hotel Management</h1>
        <p>Book your perfect stay</p>
      </div>

      <!-- Login Form -->
      <div id="loginForm" class="auth-form active">
        <div class="error-message" id="loginError"></div>
        <div class="success-message" id="loginSuccess"></div>
        
        <form id="form-login" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                required
              />
              <span class="password-toggle" onclick="togglePassword('loginPassword')">👁️</span>
            </div>
          </div>

          <div class="loading" id="loginLoading">
            <div class="spinner"></div>
            <p>Logging in...</p>
          </div>

          <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="auth-toggle">
          <p>
            Don't have an account?
            <button type="button" onclick="switchForm('register')">Register here</button>
          </p>
        </div>

        <div class="form-link">
          <a href="index.html">← Back to Home</a>
        </div>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="auth-form">
        <div class="error-message" id="registerError"></div>
        <div class="success-message" id="registerSuccess"></div>

        <form id="form-register" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="registerName">Full Name</label>
            <input
              type="text"
              id="registerName"
              name="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="registerEmail">Email Address</label>
            <input
              type="email"
              id="registerEmail"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="registerPassword">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="registerPassword"
                name="password"
                placeholder="Create a password (min 6 characters)"
                required
              />
              <span class="password-toggle" onclick="togglePassword('registerPassword')">👁️</span>
            </div>
          </div>

          <div class="form-group">
            <label for="registerConfirm">Confirm Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="registerConfirm"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
              />
              <span class="password-toggle" onclick="togglePassword('registerConfirm')">👁️</span>
            </div>
          </div>

          <div class="loading" id="registerLoading">
            <div class="spinner"></div>
            <p>Creating account...</p>
          </div>

          <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="auth-toggle">
          <p>
            Already have an account?
            <button type="button" onclick="switchForm('login')">Login here</button>
          </p>
        </div>

        <div class="form-link">
          <a href="index.html">← Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
